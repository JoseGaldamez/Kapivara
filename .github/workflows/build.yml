name: Build & Release Kapivara

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  release:
    types: [published, created]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  get-version:
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.get_version.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get version from release, tag, or wails.json
        id: get_version
        run: |
          TAG="${{ github.event.release.tag_name }}"
          if [ -z "$TAG" ]; then
            TAG="${GITHUB_REF_NAME}"
          fi
          VERSION=$(echo "$TAG" | sed 's/^v//')
          if [ -z "$VERSION" ] || [ "$VERSION" = "main" ]; then
            VERSION=$(jq -r '.info.productVersion' wails.json)
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

  build-linux:
    needs: get-version
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "stable"
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.0-dev \
            libgtk-3-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Wails app (Linux)
        run: wails build -platform linux

      - name: Generate Linux Packages (.deb and .rpm)
        run: |
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest
          mkdir -p dist

          cat << 'EOF' > kapivara.desktop
[Desktop Entry]
Name=Kapivara
GenericName=REST Client
Comment=A focused, local-first REST client for calm and efficient API work
Exec=/usr/bin/kapivara %U
Icon=kapivara
Terminal=false
Type=Application
Categories=Development;Debugger;Network;WebDevelopment;
StartupWMClass=kapivara
Keywords=api;rest;http;client;postman;graphql;
EOF

          cat << EOF > nfpm.yaml
name: "kapivara"
arch: "amd64"
platform: "linux"
version: "${{ needs.get-version.outputs.version }}"
section: "devel"
priority: "optional"
maintainer: "José Galdámez <jose@galdamez.dev>"
description: "A focused, local-first REST client for calm and efficient API work."
vendor: "José Galdámez"
homepage: "https://www.kapivara.dev"
license: "MIT"

contents:
  - src: "build/bin/kapivara"
    dst: "/usr/bin/kapivara"
    file_info:
      mode: 0755
  - src: "build/appicon.png"
    dst: "/usr/share/pixmaps/kapivara.png"
  - src: "build/appicon.png"
    dst: "/usr/share/icons/hicolor/512x512/apps/kapivara.png"
  - src: "kapivara.desktop"
    dst: "/usr/share/applications/kapivara.desktop"

overrides:
  deb:
    depends:
      - libgtk-3-0
      - libwebkit2gtk-4.0-37 | libwebkit2gtk-4.1-0
  rpm:
    depends:
      - gtk3
      - webkit2gtk4.1
EOF

          nfpm package --config nfpm.yaml --packager deb --target dist/
          nfpm package --config nfpm.yaml --packager rpm --target dist/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kapivara-linux
          path: |
            dist/*.deb
            dist/*.rpm
          retention-days: 7

  release:
    needs: [get-version, build-linux]
    runs-on: ubuntu-22.04
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'release' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/
          merge-multiple: true

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name || github.ref_name }}
          name: Kapivara ${{ github.event.release.tag_name || github.ref_name }}
          draft: false
          prerelease: false
          files: |
            artifacts/**/*
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
